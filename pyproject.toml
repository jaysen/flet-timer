[project]
name = "flet-timer"
version = "0.1.0"
description = "Desktop timer built with Flet"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = ["flet==1.0.4"]

[project.scripts]
flet-timer = "flet_timer.main:run"

[dependency-groups]
dev = [
    "flet[cli,desktop]==1.0.4",
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flet_timer"]

[tool.flet]
# Names the Linux icons to match the desktop entry; unset, they come out as None.png.
bundle_id = "com.flet.flet-timer"

[tool.flet.app]
path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
